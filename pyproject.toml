[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "scaf-research"
version = "0.1.0"
description = "Reproducible low-light RGB-D descriptor research"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
scaf = "scaf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
